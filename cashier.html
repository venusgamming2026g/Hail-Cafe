<!doctype html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B0E">
<title>الكاشير — هيل كافيه</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .pos { display: grid; grid-template-columns: 1fr 380px; gap: var(--s5); align-items: start; }
  @media (max-width: 1100px) { .pos { grid-template-columns: 1fr; } }
  .poscat { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .poscat::-webkit-scrollbar { display: none; }
  .posgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
  .positem {
    padding: 11px 10px; border-radius: var(--r-md); border: 1px solid var(--hairline); background: var(--surface);
    text-align: start; transition: all var(--t-fast) var(--e-spring); min-height: 74px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 5px;
  }
  .positem:hover { border-color: rgba(210,169,97,.5); transform: translateY(-2px); }
  .positem:active { transform: scale(.96); }
  .positem b { font-size: .8rem; font-weight: 600; line-height: 1.3; }
  .positem span { font-size: .74rem; }
  .positem[disabled] { opacity: .38; }
  .paykey {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px;
    border-radius: var(--r-md); border: 1px solid var(--hairline); font-size: .78rem; font-weight: 600;
    transition: all var(--t-base) var(--e-spring);
  }
  .paykey svg { width: 20px; height: 20px; color: var(--gold-400); }
  .paykey[aria-selected='true'] { background: rgba(210,169,97,.14); border-color: var(--gold-500); }
  .receipt { background:#fff; color:#12161A; padding:18px; border-radius:12px; font-family: var(--font-num); font-size:.8rem; }
  .receipt .r { display:flex; justify-content:space-between; padding:3px 0; }
  .receipt hr { border:0; border-top:1px dashed #B9C2CA; margin:8px 0; }
</style>
</head>
<body>
<div class="shell">
  <div id="bar"></div>
  <div class="wrap mt4"><div class="segment" id="tabs" role="tablist"></div></div>
  <main class="page wrap" id="app"></main>
</div>
<script type="module" src="assets/js/app/cashier.js"></script>
</body>
</html>
