<!doctype html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B0E">
<title>لوحة الإدارة — هيل كافيه</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .navtabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; scrollbar-width: none;
    background: rgba(255,255,255,.04); border: 1px solid var(--hairline); border-radius: var(--r-pill); }
  .navtabs::-webkit-scrollbar { display: none; }
  .navtabs button { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 16px;
    border-radius: var(--r-pill); font-size: .82rem; font-weight: 600; color: var(--fg-mute); white-space: nowrap;
    transition: all var(--t-base) var(--e-out); }
  .navtabs button svg { width: 16px; height: 16px; }
  .navtabs button:hover { color: var(--fg); }
  .navtabs button[aria-selected='true'] { background: var(--grad-gold); color: #14100A;
    box-shadow: 0 4px 16px rgba(210,169,97,.3); }
  [data-theme='day'] .navtabs { background: rgba(18,24,30,.05); }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--s4); }
  .delta { font-size: .72rem; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
  .delta svg { width: 12px; height: 12px; }
  .heat { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
  .heat i { aspect-ratio: 1; border-radius: 3px; background: rgba(255,255,255,.06); }
  .mrow { display: grid; grid-template-columns: 1fr auto auto auto; gap: var(--s3); align-items: center;
    padding: 10px var(--s3); border-bottom: 1px solid var(--hairline); }
  .mrow:last-child { border-bottom: 0; }
  .switch { width: 46px; height: 26px; border-radius: 99px; background: rgba(255,255,255,.12); position: relative;
    transition: background var(--t-base); flex: none; cursor: pointer; }
  .switch::after { content: ''; position: absolute; inset-block-start: 3px; inset-inline-start: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; transition: transform var(--t-base) var(--e-spring); }
  .switch[aria-checked='true'] { background: var(--grad-gold); }
  .switch[aria-checked='true']::after { transform: translateX(-20px); }
  html[dir='rtl'] .switch[aria-checked='true']::after { transform: translateX(-20px); }
</style>
</head>
<body>
<div class="shell">
  <div id="bar"></div>
  <div class="wrap mt4"><div class="navtabs" id="tabs" role="tablist"></div></div>
  <main class="page wrap" id="app"></main>
</div>
<script type="module" src="assets/js/app/admin.js"></script>
</body>
</html>
