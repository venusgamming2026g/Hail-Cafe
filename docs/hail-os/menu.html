<!doctype html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120d">
<meta name="description" content="المنيو الرسمي لهيل كافيه — إربد سيتي سنتر. اطلب من طاولتك مباشرة.">
<title>هيل كافيه — المنيو</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  /* ── واجهة الزبون: لمسات خاصة ── */
  .hero {
    position: relative; padding: var(--s6) var(--s4) var(--s8); overflow: hidden;
    border-radius: 0 0 var(--r-2xl) var(--r-2xl); margin-bottom: var(--s4);
  }
  .hero::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background:
      radial-gradient(120% 90% at 78% 0%, rgba(192,70,42,.22), transparent 62%),
      radial-gradient(90% 80% at 12% 8%, rgba(227,59,36,.16), transparent 60%),
      var(--grad-ink);
    border-radius: inherit; border: 1px solid var(--hairline); border-top: 0;
  }
  .hatch {
    width: 132px; height: 132px; border-radius: 50%; overflow: hidden; flex: none;
    border: 2px solid rgba(192,70,42,.4); box-shadow: 0 18px 44px rgba(0,0,0,.5), inset 0 0 0 6px rgba(255,255,255,.05);
    position: relative;
  }
  .hatch img { width: 100%; height: 100%; object-fit: cover; }
  .hatch::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(200deg, rgba(255,255,255,.22), transparent 46%);
  }
  .seam { display: flex; align-items: center; gap: 8px; }
  .seam i { width: 9px; height: 9px; background: var(--clay-500); transform: rotate(45deg); border-radius: 2px; }
  .seam span { height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--clay-600), transparent); }

  .searchbox { position: relative; }
  .searchbox svg { position: absolute; inset-inline-start: 14px; inset-block-start: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--fg-faint); pointer-events: none; }
  .searchbox .field { padding-inline-start: 44px; }

  .catrail-wrap { position: sticky; top: var(--header-h); z-index: 50;
    background: color-mix(in srgb, var(--bg) 84%, transparent);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--hairline); }

  .feat { display: flex; gap: var(--s3); overflow-x: auto; padding: 2px var(--s4) var(--s4); scrollbar-width: none;
    scroll-snap-type: x mandatory; }
  .feat::-webkit-scrollbar { display: none; }
  .feat > * { flex: none; width: 264px; scroll-snap-align: start; }

  .sec-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s6) var(--s4) var(--s3); }
  .sec-head h2 { font-size: 1.25rem; }
  .sec-head .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--hairline-2), transparent); }

  .detail-shot { aspect-ratio: 16/10; overflow: hidden; position: relative; }
  .detail-shot img { width: 100%; height: 100%; object-fit: cover; }
  .detail-shot::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 46%, var(--ink-900)); }

  .opt { display: flex; align-items: center; gap: 10px; padding: 11px var(--s3); border-radius: var(--r-md);
    border: 1px solid var(--hairline); cursor: pointer; transition: all var(--t-base) var(--e-out); }
  .opt:hover { border-color: var(--hairline-2); background: rgba(255,255,255,.04); }
  .opt[aria-checked='true'] { border-color: var(--clay-500); background: rgba(192,70,42,.1); }
  .opt .tick { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--hairline-2); flex: none;
    display: grid; place-items: center; transition: all var(--t-base) var(--e-spring); }
  .opt[aria-checked='true'] .tick { border-color: var(--clay-500); background: var(--clay-500); color: #fff; }
  .opt .tick svg { width: 12px; height: 12px; opacity: 0; transition: opacity var(--t-fast); }
  .opt[aria-checked='true'] .tick svg { opacity: 1; }

  .svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
  .svc {
    display: flex; flex-direction: column; align-items: center; gap: 7px; padding: var(--s4) var(--s2);
    border-radius: var(--r-md); border: 1px solid var(--hairline); background: var(--surface);
    font-size: .74rem; font-weight: 600; text-align: center; transition: all var(--t-base) var(--e-spring);
  }
  .svc:hover { transform: translateY(-2px); border-color: rgba(192,70,42,.4); }
  .svc:active { transform: scale(.95); }
  .svc svg { width: 21px; height: 21px; color: var(--clay-300); }
  .svc[data-sent='1'] { border-color: rgba(46,158,126,.5); background: rgba(46,158,126,.1); }
  .svc[data-sent='1'] svg { color: var(--ok-400); }

  @media (max-width: 560px) { .hatch { width: 96px; height: 96px; } }

  /* ── الطابع الفاخر للمنيو — يتبع الثيم: ليلي أسود×ذهبي، نهاري رملي×ذهبي ── */
  :root {
    --lux-gold: #d9b25f;
    --lux-gold-2: #b98a2f;
    --lux-line: rgba(217, 178, 95, .34);
  }
  [data-theme='day'] {
    --lux-gold: #8a6a1f;
    --lux-gold-2: #a67c2e;
    --lux-line: rgba(138, 106, 31, .38);
  }

  .lux-sec { text-align: center; padding: var(--s8) var(--s4) var(--s3); }
  .lux-trio { display: flex; justify-content: center; gap: var(--s4); margin-bottom: var(--s5); }
  .lux-trio img {
    width: 108px; height: 108px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--lux-line); box-shadow: 0 12px 34px rgba(0, 0, 0, .3);
  }
  .lux-sec .sec-ic { width: 26px; height: 26px; margin: 0 auto var(--s2); color: var(--lux-gold); }
  .lux-sec .sec-ic svg { width: 100%; height: 100%; }
  .lux-sec h2 {
    font-size: clamp(1.5rem, 4.5vw, 2rem); color: var(--lux-gold); letter-spacing: .4px;
    text-shadow: 0 1px 14px color-mix(in srgb, var(--lux-gold) 26%, transparent);
  }
  .lux-sec .sec-en {
    display: block; margin-top: 5px; font-size: .7rem; letter-spacing: .34em;
    color: var(--fg-mute); text-transform: uppercase; padding-inline-start: .34em;
  }
  .lux-div { display: flex; align-items: center; gap: 12px; max-width: 430px; margin: var(--s4) auto 0; color: var(--lux-gold); }
  .lux-div::before { content: ''; flex: 1; height: 1px; background: linear-gradient(-90deg, var(--lux-line), transparent); }
  .lux-div::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--lux-line), transparent); }
  .lux-div svg { width: 15px; height: 15px; }

  .lux-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: var(--s3); }
  .lux-card {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s4);
    padding: 15px 18px; border-radius: var(--r-lg); border: 1px solid var(--hairline);
    background: var(--surface); cursor: pointer;
    transition: border-color var(--t-base) var(--e-out), transform var(--t-base) var(--e-out), box-shadow var(--t-base) var(--e-out);
  }
  .lux-card:hover { border-color: var(--lux-line); transform: translateY(-2px); box-shadow: var(--sh-2); }
  .lux-card:active { transform: scale(.985); }
  .lux-card .nm h4 { font-size: .98rem; line-height: 1.45; }
  .lux-card .nm .en { display: block; margin-top: 2px; font-size: .68rem; color: var(--fg-faint); }
  .lux-card .nm .chip-bad { margin-top: 5px; }
  .lux-price { flex: none; text-align: center; min-width: 52px; }
  .lux-price b { font-size: 1.08rem; letter-spacing: .2px; }
  .lux-price span { display: block; font-size: .58rem; color: var(--fg-faint); margin-top: 1px; }
  .lux-badge {
    display: inline-block; margin-inline-start: 7px; vertical-align: 2px;
    font-size: .6rem; font-weight: 700; color: #221a06; padding: 2.5px 9px; border-radius: 99px;
    background: linear-gradient(135deg, var(--lux-gold), var(--lux-gold-2));
  }
  .lux-card.out { opacity: .5; }
  .lux-card.out:hover { transform: none; box-shadow: none; border-color: var(--hairline); }
  @media (max-width: 560px) { .lux-trio img { width: 88px; height: 88px; } }

  /* شريط الأقسام بلون الذهب في هذه الواجهة */
  .catrail button[aria-selected='true'] {
    background: linear-gradient(135deg, var(--lux-gold), var(--lux-gold-2));
    border-color: transparent; color: #221a06;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--lux-gold) 28%, transparent);
  }
</style>
</head>
<body>
<div class="shell">
  <div id="bar"></div>

  <main class="page" id="app">
    <div class="empty"><div class="ic"></div><h3>جارٍ تحضير المنيو…</h3></div>
  </main>

  <div id="cartbar"></div>
</div>

<script type="module" src="assets/js/app/customer.js"></script>
<noscript>
  <div style="padding:24px;text-align:center">
    هذا المنيو يحتاج تفعيل JavaScript في المتصفح.
  </div>
</noscript>
</body>
</html>
