    <style>
        :root {
            --clay-50: #fdf0ea; --clay-100: #fadbcf; --clay-300: #ff8163;

            --olive-50: #eef1e2; --olive-100: #dde3c8; --olive-300: #a6b27e;

            --camel-600: #a68766; --camel-700: #7a6247;
            --sand-0: #fffdf8; --sand-50: #faf3e7; --sand-100: #f3e9d8;
            --bg-color: #f8efdf;
            --ink-900: #16120d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: var(--bg-color);
            color: var(--ink-900);
            line-height: 1.6;
        }
        h1, h2, h3, .display-font { font-family: 'Alexandria', sans-serif; }
        a { text-decoration: none; color: inherit; }
        
        /* Header */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(248, 239, 223, 0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05); transition: all 0.3s ease;
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo img { height: 58px; width: 58px; object-fit: contain; background: transparent; filter: drop-shadow(0 2px 6px rgba(34,29,22,0.12)); }
        nav ul { display: flex; gap: 2rem; list-style: none; }
        nav a { font-weight: 500; transition: color 0.2s ease; }
        nav a:hover { color: var(--clay-600); }
        .btn {
            display: inline-block; padding: 0.75rem 1.5rem; border-radius: 20px;
            font-family: 'Alexandria', sans-serif; font-weight: 700;
            cursor: pointer; transition: all 0.3s ease; text-align: center;
        }
        .btn-primary { background-color: var(--clay-600); color: #fff; border: none; }
        .btn-primary:hover { background-color: var(--clay-700); transform: translateY(-2px); }

        /* Hero */
        .hero {
            position: relative; height: 50vh; min-height: 400px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; overflow: hidden; margin-bottom: 2rem;
        }
        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('./hail-gallery/menu-hero.jpeg'); background-size: cover; background-position: center;
            z-index: -2; border-bottom-left-radius: 50% 10%; border-bottom-right-radius: 50% 10%;
        }
        .hero-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(22, 18, 13, 0.5), rgba(22, 18, 13, 0.8));
            z-index: -1; border-bottom-left-radius: 50% 10%; border-bottom-right-radius: 50% 10%;
        }
        .hero-content { color: #fff; padding: 0 2rem; animation: fadeIn 1s ease-out; margin-top: 4rem;}
        .hero h1 { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; }
        .hero p { font-size: 1.25rem; opacity: 0.9; }

        /* Service Strip */
        .service-strip {
            display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;
            margin: -3rem auto 3rem; position: relative; z-index: 10;
            background: #fff; padding: 1.5rem 2rem; border-radius: 20px;
            max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 90%;
        }
        .service-step {
            display: flex; align-items: center; gap: 0.75rem; font-weight: 600; color: var(--camel-700);
        }
        .step-num {
            background: var(--camel-100); color: var(--camel-700);
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-weight: 700;
        }

        /* Menu Section */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem 6rem; }
        
        .tabs-container {
            position: sticky; top: 80px; z-index: 90;
            background: var(--bg-color); padding: 1rem 0; margin-bottom: 2rem;
        }
        .tabs-scroll {
            display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 1rem;
            scrollbar-width: thin; scrollbar-color: var(--camel-500) transparent;
        }
        .tabs-scroll::-webkit-scrollbar { height: 6px; }
        .tabs-scroll::-webkit-scrollbar-thumb { background: var(--camel-500); border-radius: 10px; }
        
        .tab-btn {
            background: #fff; border: 1px solid var(--camel-100);
            padding: 0.75rem 1.5rem; border-radius: 30px; white-space: nowrap;
            font-family: inherit; font-weight: 600; color: var(--ink-700);
            cursor: pointer; transition: all 0.2s ease;
        }
        .tab-btn:hover { background: var(--camel-50); }
        .tab-btn.active {
            background: var(--clay-600); color: #fff; border-color: var(--clay-600);
        }

        .menu-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .menu-item {
            background: #fff; border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: all 0.3s ease;
            display: flex; flex-direction: column; animation: fadeIn 0.5s ease-out;
        }
        .menu-item:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        
        .item-img { width: 100%; height: 200px; object-fit: cover; }
        .item-content { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
        .item-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.4; }
        .item-price {
            margin-top: auto; color: var(--clay-600); font-weight: 700; font-size: 1.1rem;
            display: inline-block; background: var(--clay-50); padding: 0.25rem 0.75rem; border-radius: 8px;
            align-self: flex-start;
        }

        /* Footer */
        footer { background-color: var(--clay-600); color: #fff; padding: 4rem 2rem 2rem; }
        .footer-content {
            max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between;
            align-items: flex-start; flex-wrap: wrap; gap: 2rem;
        }
        .footer-logo img { height: 72px; width: 72px; object-fit: contain; background: transparent; margin-bottom: 1rem; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25)); }
        .footer-bottom {
            text-align: center; margin-top: 4rem; padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; opacity: 0.8;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            nav ul { display: none; }
            .hero h1 { font-size: 2rem; }
            .service-strip { gap: 1rem; padding: 1rem; }
            .service-step { font-size: 0.9rem; }
            .menu-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .item-img { height: 140px; }
            .item-content { padding: 1rem; }
            .item-title { font-size: 1rem; }
        }
    </style>

        const tabsContainer = document.getElementById('tabs-container');
        CATEGORIES.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.dataset.category = cat.id;
            btn.innerText = cat.ar;
            tabsContainer.appendChild(btn);
        });

        const menuGrid = document.getElementById('menu-grid');

        function renderItems(category) {
            menuGrid.innerHTML = '';
            const list = category === 'all' ? ITEMS : ITEMS.filter(x => x.c === category);
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-item';

                const img = document.createElement('img');
                img.className = 'item-img';
                img.loading = 'lazy';
                img.width = 400; img.height = 200;   /* يحجز مكانه قبل التحميل — لا قفزات */
                img.src = item.i;
                img.alt = item.n;
                img.onerror = () => { img.src = './hail-logo.png'; };

                const content = document.createElement('div');
                content.className = 'item-content';

                const title = document.createElement('h3');
                title.className = 'item-title display-font';
                title.innerText = item.n;

                const price = document.createElement('div');
                price.className = 'item-price';
                price.innerText = item.p + ' د.أ';

                content.appendChild(title);
                content.appendChild(price);
                card.appendChild(img);
                card.appendChild(content);
                menuGrid.appendChild(card);
            });
        }

        document.querySelectorAll('.tabs-scroll').forEach(rail => rail.addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            renderItems(btn.dataset.category);
        }));

        renderItems('all');

        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.style.background = 'rgba(248, 239, 223, 0.95)';
                header.style.boxShadow = '0 2px 10px rgba(0,0,0,0.05)';
            } else {
                header.style.background = 'rgba(248, 239, 223, 0.85)';
                header.style.boxShadow = 'none';
            }
        });
    </script>
