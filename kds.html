<!doctype html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B0E">
<title>شاشة المطبخ — هيل كافيه</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  body { font-size: 16px; }
  .kds-grid {
    display: grid; gap: var(--s4); padding: var(--s4);
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-items: start;
  }
  .kds-cols { display: grid; gap: var(--s4); padding: var(--s4); grid-template-columns: repeat(3, 1fr); align-items: start; }
  @media (max-width: 1000px) { .kds-cols { grid-template-columns: 1fr; } }
  .colhead {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: var(--s3);
    border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--hairline);
    position: sticky; top: calc(var(--header-h) + 58px); z-index: 20;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .colhead b { font-size: .95rem; }
  .stationbar { padding: 8px var(--s4); position: sticky; top: var(--header-h); z-index: 40;
    background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--hairline); }
  .kcard .head .timer { font-family: var(--font-num); font-weight: 800; font-size: 1.05rem; }
  .kline .name { font-size: 1.02rem; font-weight: 600; line-height: 1.35; }
  .kline .opts { font-size: .74rem; color: var(--fg-mute); }
  .kline .stn { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: var(--s3); padding: 0 var(--s4) var(--s2); }
</style>
</head>
<body>
<div class="shell">
  <div id="bar"></div>
  <div id="stations"></div>
  <div class="metrics mt4" id="metrics"></div>
  <main class="page" id="app" style="padding-top:0"></main>
</div>
<script type="module" src="assets/js/app/kds.js"></script>
</body>
</html>
